version: '3.8'

services:
  # Streamlit 웹 UI
  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      - KISED_SERVICE_KEY=${KISED_SERVICE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers}
    volumes:
      - ./cache:/app/cache
      - ./reports:/app/reports
    command: streamlit run web/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

  # FastAPI 서버
  fastapi:
    build: .
    ports:
      - "8000:8000"
    environment:
      - KISED_SERVICE_KEY=${KISED_SERVICE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers}
    volumes:
      - ./cache:/app/cache
      - ./reports:/app/reports
    command: uvicorn web.fastapi_app:app --host 0.0.0.0 --port 8000
    profiles:
      - api  # 실행: docker-compose --profile api up
