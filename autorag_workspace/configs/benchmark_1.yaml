# AutoRAG 임베딩 벤치마크 (Collection name 수정)

node_lines:
  - node_line_name: retrieve_node_line
    nodes:
      # Lexical Retrieval
      - node_type: lexical_retrieval
        strategy:
          metrics:
            - retrieval_f1
            - retrieval_recall
            - retrieval_precision
            - retrieval_ndcg
            - retrieval_map
            - retrieval_mrr
        top_k: 1
        modules:
          - module_type: bm25
      